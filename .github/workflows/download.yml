name: Download SoundCloud Playlist

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'SoundCloud Playlist URL'
        required: true
      output_folder:
        description: 'Output folder name'
        required: false
        default: 'output'
      audio_format:
        description: 'Audio format (mp3, or best to keep the original stream)'
        required: false
        default: 'mp3'

jobs:
  run:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install

      - name: Run downloader
        env:
          SOUNDCLOUD_OAUTH_TOKEN: ${{ secrets.SOUNDCLOUD_OAUTH_TOKEN }}
        run: |
          poetry run python -m soundclouddownloader.cli_entry \
            --url "${{ github.event.inputs.playlist_url }}" \
            --output "${{ github.event.inputs.output_folder }}" \
            --audio-format "${{ github.event.inputs.audio_format }}"

      - name: Upload output files
        uses: actions/upload-artifact@v4
        with:
          name: playlist-output
          path: ${{ github.event.inputs.output_folder }}
